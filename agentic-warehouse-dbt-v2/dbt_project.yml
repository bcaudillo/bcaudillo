name: agentic_data_warehouse
version: 2.0.0
config-version: 2
profile: agentic_data_warehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  demo_quarter: "2026-Q2"
  salesforce_schema: raw_salesforce
  stripe_schema: raw_stripe
  finance_schema: analytics
  metadata_schema: metadata
  salesforce_freshness_hours: 30
  stripe_freshness_hours: 6
  warehouse_freshness_hours: 24

models:
  agentic_data_warehouse:
    staging:
      +materialized: view
    governance:
      +materialized: table
    context:
      +materialized: table

